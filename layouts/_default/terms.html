{{ define "main" }}
  <section class="page-heading">
    <p class="eyebrow">{{ .Type }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </section>

  <section class="listing term-grid">
    {{ range .Data.Terms.Alphabetical }}
      <article class="term-card">
        <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
        <span>{{ .Count }} 篇</span>
      </article>
    {{ end }}
  </section>
{{ end }}
