baseURL = "https://ethan-rookie.github.io/"
locale = "zh-cn"
title = "Ethan-rookie 的个人博客"
enableRobotsTXT = true
summaryLength = 28

[params]
  author = "Ethan-rookie"
  subtitle = "记录工程实践、产品思考和长期项目。"
  description = "一个面向长期写作的个人博客，关注工程、产品、AI 基础设施和独立项目。"
  heroImage = "images/home-hero.png"
  github = "https://github.com/Ethan-rookie"
  email = "hello@example.com"

[params.comments]
  enabled = true

[params.giscus]
  repo = "Ethan-rookie/Ethan-rookie.github.io"
  repoId = "R_kgDOSqB_hA"
  category = "General"
  categoryId = "DIC_kwDOSqB_hM4C9_p6"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  loading = "lazy"

[menu]
  [[menu.main]]
    name = "首页"
    pageRef = "/"
    weight = 10
  [[menu.main]]
    name = "文章"
    pageRef = "/posts"
    weight = 20
  [[menu.main]]
    name = "项目"
    pageRef = "/projects"
    weight = 30
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"

[caches]
  [caches.images]
    dir = ":cacheDir/images"
